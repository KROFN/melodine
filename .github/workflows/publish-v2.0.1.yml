name: Publish v2.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v2.0.1.trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v2.0.1 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.1 already published"
            exit 0
          fi

          gh release create v2.0.1             --repo "$GITHUB_REPOSITORY"             --target "0aa0376b9b050a0ae6a8edfe5fdbe1db029debb6"             --title "Melodine v2.0.1 — Flagship overhaul"             --notes-file ".github/release-notes/v2.0.1.md"
