# CI pipeline for Melodine v2.0.
#
# This file is shipped as a ready-to-use template because API tokens without
# the `workflow` scope cannot create files inside `.github/workflows/`.
# To enable CI, run exactly one command after merging (or from this branch):
#
#     git mv .github/ci.workflow.example.yml .github/workflows/ci.yml && git commit -m "ci: enable pipeline" && git push
#
# The pipeline runs ruff + the full 204-test pytest suite on Linux and
# Windows for Python 3.10 - 3.13.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest -v
